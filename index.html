<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Theme Channel Page</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWM4s05ODU32EigR-UHn-y57a9GM9JAJkg8Q&usqp=CAU" alt="YouTube Logo">
        </div>
        <div class="search-box">
            <input type="text" placeholder="Search">
            <button><i class="material-icons">search</i></button>
        </div>
        <div class="icons">
            <i class="material-icons">video_call</i>
            <i class="material-icons">apps</i>
            <i class="material-icons">notifications</i>
            <i class="material-icons">account_circle</i>
        </div>
    </header>

    <section class="profile">
        <div class="profile-container">
            <img class="channel-logo" src="https://yt3.googleusercontent.com/bCedUDk7tMoPHvhqW3-KlB3IehIUnizvDwbQBmRR0MbOJIAjHdEohWJ2hNN_LMLSEmA5Ju95Hg=s120-c-k-c0x00ffffff-no-rj" alt="RJ">
            <div class="profile-info">
                <h3 class="channel-name">RJ Lusifer</h3>
                <button class="subscribe-btn" onclick="window.location.href='https://youtube.com/c/RJLusiferKumar'">SUBSCRIBE 🔔</button>
            </div>
        </div>
    </section>

    <h3 class="section-title">Shorts</h3>
    <div class="shorts-container">
        <div class="shorts-slider">
             <div class="short"><iframe src="https://www.youtube.com/embed/6qHz4kxuYeE" allowfullscreen></iframe></div>
             <div class="short"><iframe src="https://www.youtube.com/embed/b2DmtKChyE4" allowfullscreen></iframe></div>
             <div class="short"><iframe src="https://www.youtube.com/embed/Nfsyu4wU4TE" allowfullscreen></iframe></div>
             <div class="short"><iframe src="https://www.youtube.com/embed/D-rvfuw3UGQ" allowfullscreen></iframe></div>
            
            <div class="short"><iframe src="https://www.youtube.com/embed/6oIdYwsxLbg" allowfullscreen></iframe></div>
            <div class="short"><iframe src="https://www.youtube.com/embed/D-rvfuw3UGQ" allowfullscreen></iframe></div>
            <div class="short"><iframe src="https://www.youtube.com/embed/6iRqKFhr7iw" allowfullscreen></iframe></div>
            <div class="short"><iframe src="https://www.youtube.com/embed/Ahm2IF4dlnU" allowfullscreen></iframe></div>
        </div>
    </div>

    <h3 class="section-title">Videos</h3>
    <div class="video-grid">
        <div class="video"><iframe src="https://www.youtube.com/embed/84Q7hWcb8Kg" allowfullscreen></iframe></div>
        <div class="video"><iframe src="https://www.youtube.com/embed/fMrENpGtEf" allowfullscreen></iframe></div>
        <div class="video"><iframe src="https://www.youtube.com/embed/WNB7i1vSlvs" allowfullscreen></iframe></div>
        <div class="video"><iframe src="https://www.youtube.com/embed/bGLqahiyfVM" allowfullscreen></iframe></div>
        <div class="video"><iframe src="https://www.youtube.com/embed/ecCFujAEL3Y" allowfullscreen></iframe></div>
    </div>
</body>
</html>
