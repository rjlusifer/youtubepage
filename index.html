<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJ Lusifer-Video Gllary</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- YouTube Style Header -->
    <header>
        <div class="logo">
            <img src="https://yt3.googleusercontent.com/bCedUDk7tMoPHvhqW3-KlB3IehIUnizvDwbQBmRR0MbOJIAjHdEohWJ2hNN_LMLSEmA5Ju95Hg=s120-c-k-c0x00ffffff-no-rj" alt="YouTube">
        </div>
        <div class="search-box">
            <input type="text" placeholder="Search">
            <button><i class="material-icons">search</i></button>
        </div>
        <div class="icons">
            <i class="material-icons">video_call</i>
            <i class="material-icons">apps</i>
            <i class="material-icons">notifications</i>
            <i class="material-icons">account_circle</i>
        </div>
    </header>

    <!-- Profile Section -->
    <div class="profile">
        <img src="https://yt3.ggpht.com/HXWsqEZ-0uXmvum-AoHMTtK8i7ytbaeKZQ-RlDQh1iG9vWuVcgtvoyGdRm8n3dSaCqZ_RTsLfPw=s176-c-k-c0x00ffffff-no-rj" alt="RJ Lusifer Kumar">
        <h2>RJ Lusifer</h2>
        <button class="subscribe-btn">SUBSCRIBE 🔔</button>
    </div>

    <!-- Shorts Section -->
    <h3 class="section-title">Shorts</h3>
    <div class="shorts-container">
        <div class="shorts-slider">
            <div class="short">
                <iframe src="https://www.youtube.com/embed/Nfsyu4wU4TE" allowfullscreen></iframe>
            </div>
            <div class="short">
                <iframe src="https://www.youtube.com/embed/D-rvfuw3UGQ" allowfullscreen></iframe>
            </div>
            <div class="short">
                <iframe src="https://www.youtube.com/embed/6iRqKFhr7iw" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Video Grid -->
    <h3 class="section-title">Videos</h3>
    <section class="video-grid">
        <div class="video">
            <iframe src="https://www.youtube.com/embed/PTCalB3BdYo" allowfullscreen></iframe>
            <p>Video Title 1</p>
        </div>
        <div class="video">
            <iframe src="https://www.youtube.com/embed/R-0ZQ0djurE" allowfullscreen></iframe>
            <p>Video Title 2</p>
        </div>
        <div class="video">
            <iframe src="https://www.youtube.com/embed/uOkRjdqE2Ws" allowfullscreen></iframe>
            <p>Video Title 3</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
